name: Archive forecasts

# Captures the ISO-NE load forecast and the weather forecast as issued.
# Historical ISO files keep only same-day vintages, so the day-ahead
# benchmark exists only if it is archived live.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: uv sync --locked --no-dev
      - run: uv run ne-demand archive
        env:
          NE_DATA_ROOT: ${{ vars.NE_DATA_ROOT }}
