name: Monitor

# Hourly, after ingest: data freshness, forecast error, input drift (once a day),
# de-duplicated alerts by SNS email, and a heartbeat the AWS watchdog checks.
# The watchdog runs inside AWS, so a stalled GitHub schedule is still noticed.

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      inject_shift:
        description: "Drill: inject an input shift, e.g. temp_boston=8 (empty for a normal run)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: data-root
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: uv sync --locked --no-dev --extra monitoring
      - name: Run one monitoring cycle
        env:
          NE_DATA_ROOT: ${{ vars.NE_DATA_ROOT }}
          SNS_TOPIC_ARN: ${{ vars.SNS_TOPIC_ARN }}
          INJECT: ${{ inputs.inject_shift }}
        run: |
          if [ -n "$INJECT" ]; then
            uv run ne-demand monitor --inject-shift "$INJECT" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            uv run ne-demand monitor | tee -a "$GITHUB_STEP_SUMMARY"
          fi
