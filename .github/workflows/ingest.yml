name: Ingest

# Hourly: recent ISO-NE load, day-ahead weather, and the live ISO and weather
# forecasts as issued. Historical ISO files keep only same-day vintages, so the
# day-ahead benchmark exists only because this job archives it (ADR 0002).

# Triggered hourly at :17 UTC by AWS EventBridge Scheduler via the dispatcher Lambda
# (infra/aws/scheduling.tf, ADR 0009); GitHub's own cron skipped too many runs.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: data-root
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: uv sync --locked --no-dev
      - run: uv run ne-demand ingest
        env:
          NE_DATA_ROOT: ${{ vars.NE_DATA_ROOT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SNS_TOPIC_ARN: ${{ vars.SNS_TOPIC_ARN }}
