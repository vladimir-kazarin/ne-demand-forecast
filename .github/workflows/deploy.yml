name: Deploy

# On merge: if model-relevant files changed, train a candidate and gate it against
# production. Then build the image for whatever is production now and deploy it to
# the API, so every code change ships, with the current production model.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "configs/**"
      - "serving/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      train:
        description: "Train and gate a candidate first"
        type: boolean
        default: true
      config:
        description: "Training config for the candidate"
        type: string
        default: configs/lightgbm_v1.yaml

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  NE_DATA_ROOT: ${{ vars.NE_DATA_ROOT }}
  MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
  MLFLOW_DISABLE_AGENT_HINT: "1"
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SNS_TOPIC_ARN: ${{ vars.SNS_TOPIC_ARN }}
  ECR_REPOSITORY: ne-demand-api

jobs:
  changes:
    # Retraining only makes sense when something that shapes the model changed:
    # features, training, processing, validation, settings, configs, or dependencies.
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.diff.outputs.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "model=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(src/ne_demand/(features|training|validation)/|src/ne_demand/(processing|config)\.py$|configs/|pyproject\.toml$|uv\.lock$)'; then
            echo "model=true" >> "$GITHUB_OUTPUT"
            echo "Model-relevant files changed: training a candidate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "model=false" >> "$GITHUB_OUTPUT"
            echo "No model-relevant changes: skipping training, redeploying the current production model." >> "$GITHUB_STEP_SUMMARY"
          fi

  train-and-gate:
    needs: changes
    if: (github.event_name == 'push' && needs.changes.outputs.model == 'true') || (github.event_name == 'workflow_dispatch' && inputs.train)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: uv sync --locked --no-dev
      - name: Train candidate
        run: uv run ne-demand train --config "${{ inputs.config || 'configs/lightgbm_v1.yaml' }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gate candidate against production
        run: uv run ne-demand gate | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [changes, train-and-gate]
    if: always() && needs.changes.result == 'success' && (needs.train-and-gate.result == 'success' || needs.train-and-gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: uv sync --locked --no-dev
      - name: Export production model
        id: model
        run: |
          uv run ne-demand export-model --out build/model
          echo "version=$(uv run ne-demand production-version)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-v${{ steps.model.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Point the API at the new image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-v${{ steps.model.outputs.version }}
          aws lambda update-function-code --function-name ne-demand-api --image-uri "$IMAGE" >/dev/null
          aws lambda wait function-updated-v2 --function-name ne-demand-api
          echo "Deployed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the live API
        run: uv run python scripts/check_api.py "${{ vars.API_URL }}" --expect-version "${{ steps.model.outputs.version }}"
