name: Daily forecast

# Triggered at 10:32 America/New_York every day by AWS EventBridge Scheduler, which
# handles daylight saving (infra/aws/scheduling.tf, ADR 0009). `--scheduled` still
# skips a run before 10:30 local or after tomorrow's forecast exists, so manual
# re-runs and retries are safe.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: data-root
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NE_DATA_ROOT: ${{ vars.NE_DATA_ROOT }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SNS_TOPIC_ARN: ${{ vars.SNS_TOPIC_ARN }}
      # Production model is resolved from the MLflow registry on DagsHub (ADR 0005).
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: uv sync --locked --no-dev
      - name: Refresh inputs
        run: uv run ne-demand ingest
      - name: Forecast tomorrow
        run: uv run ne-demand forecast --scheduled
